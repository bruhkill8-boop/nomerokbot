<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Номерок | Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --text: #f8fafc;
            --accent: #22c55e;
            --danger: #ef4444;
            --gold: #eab308;
            --gray: #64748b;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            user-select: none;
        }
        .container { width: 100%; max-width: 420px; display: flex; flex-direction: column; gap: 10px; }
        
        .user-card, .stats-bar, .game-card, .section {
            background: var(--card);
            padding: 12px;
            border-radius: 16px;
            border: 1px solid #334155;
        }

        .stats-bar { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .stat-val { font-size: 18px; font-weight: 800; }

        .country-select {
            display: flex;
            gap: 6px;
            justify-content: center;
            margin-bottom: 8px;
        }
        .country-btn {
            background: #0f172a;
            border: 1px solid #334155;
            color: white;
            padding: 6px 12px;
            border-radius: 10px;
            font-size: 12px;
            cursor: pointer;
            font-weight: bold;
        }
        .country-btn.active { border-color: var(--accent); background: #15803d; }

        .plate {
            background: #fff;
            border: 4px solid #111;
            border-radius: 10px;
            padding: 8px 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 85%;
            max-width: 280px;
            margin: 10px auto;
            color: #111;
            box-shadow: 0 6px 15px rgba(0,0,0,0.4);
        }
        .plate-text { font-family: monospace; font-size: 28px; font-weight: 900; letter-spacing: 2px; }
        .plate-flag { display: flex; flex-direction: column; align-items: center; border-left: 2px solid #111; padding-left: 6px; font-size: 10px; font-weight: bold; }

        .btn-main {
            background: linear-gradient(135deg, #22c55e, #15803d);
            color: white;
            border: none;
            width: 100%;
            padding: 14px;
            font-size: 16px;
            font-weight: 800;
            border-radius: 14px;
            cursor: pointer;
        }
        .btn-main:active { transform: scale(0.97); }

        .car-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .car-card { background: #0f172a; padding: 10px; border-radius: 12px; border: 1px solid #334155; text-align: center; }
        .car-btn { background: var(--gold); color: #111; border: none; padding: 6px 10px; font-weight: bold; border-radius: 8px; margin-top: 6px; cursor: pointer; width: 100%; }

        .log-box { font-size: 13px; min-height: 24px; font-weight: bold; text-align: center; }
        .cost-tag { font-size: 11px; color: var(--danger); font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <!-- Статистика -->
        <div class="stats-bar">
            <div>
                <div style="font-size:10px; color:var(--gray);">БАЛАНС</div>
                <div class="stat-val" id="balanceText" style="color:var(--gold);">1 000 ₽</div>
            </div>
            <div>
                <div style="font-size:10px; color:var(--gray);">АВТОМОБИЛЬ</div>
                <div class="stat-val" id="carText" style="font-size:14px; color:#38bdf8;">Пешком</div>
            </div>
        </div>

        <!-- Поле игры -->
        <div class="game-card" style="text-align:center;">
            <!-- Выбор страны -->
            <div class="country-select">
                <button class="country-btn active" onclick="setCountry('UA', '🇺🇦')">🇺🇦 UA</button>
                <button class="country-btn" onclick="setCountry('USA', '🇺🇸')">🇺🇸 USA</button>
                <button class="country-btn" onclick="setCountry('EU', '🇪🇺')">🇪🇺 EU</button>
                <button class="country-btn" onclick="setCountry('KZ', '🇰🇿')">🇰🇿 KZ</button>
            </div>

            <!-- Номерной знак -->
            <div class="plate" id="plateCard">
                <div class="plate-text" id="plateDisplay">AA 0000 AA</div>
                <div class="plate-flag">
                    <span id="flagDisplay">🇺🇦</span>
                    <span id="countryCode">UA</span>
                </div>
            </div>

            <div class="log-box" id="logText">Жми кнопку, чтобы крутить!</div>
            <div class="cost-tag">Цена прокрута: <span id="spinCostText">500</span> ₽</div>
            <button class="btn-main" onclick="spinPlate()" style="margin-top:8px;">Сгенерировать номер</button>
        </div>

        <!-- Автосалон -->
        <div class="section">
            <div style="font-size:14px; font-weight:800; margin-bottom:8px;">🚗 Автосалон (Дает множитель к наградам)</div>
            <div class="car-grid">
                <div class="car-card">
                    <div style="font-size:20px;">🏎️</div>
                    <div style="font-weight:bold; font-size:13px;">Жигули</div>
                    <div style="font-size:11px; color:var(--gray);">х1.5 к выигрышу</div>
                    <button class="car-btn" onclick="buyCar('Жигули', 15000, 1.5)">15 000 ₽</button>
                </div>
                <div class="car-card">
                    <div style="font-size:20px;">🚘</div>
                    <div style="font-weight:bold; font-size:13px;">BMW M5</div>
                    <div style="font-size:11px; color:var(--gray);">х3.0 к выигрышу</div>
                    <button class="car-btn" onclick="buyCar('BMW M5', 100000, 3.0)">100 000 ₽</button>
                </div>
                <div class="car-card">
                    <div style="font-size:20px;">🚙</div>
                    <div style="font-weight:bold; font-size:13px;">Gelandewagen</div>
                    <div style="font-size:11px; color:var(--gray);">х5.0 к выигрышу</div>
                    <button class="car-btn" onclick="buyCar('Гелик', 500000, 5.0)">500 000 ₽</button>
                </div>
                <div class="car-card">
                    <div style="font-size:20px;">🏎️</div>
                    <div style="font-weight:bold; font-size:13px;">Bugatti</div>
                    <div style="font-size:11px; color:var(--gray);">х10.0 к выигрышу</div>
                    <button class="car-btn" onclick="buyCar('Bugatti', 2000000, 10.0)">2 000 000 ₽</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        let state = {
            balance: 5000,
            spinCost: 500,
            car: "Пешком",
            multiplier: 1.0,
            country: "UA",
            flag: "🇺🇦"
        };

        const alphabets = {
            UA: "ABCEHIKMOPTX",
            USA: "ABCDEFGHIJKLMNOPQRSTUVWXYZ",
            EU: "ABCDEFGHJKLMNPRSTUVWXYZ",
            KZ: "ABCDEFGHIJKLMNOPQRSTUVWXYZ"
        };

        function setCountry(code, flag) {
            state.country = code;
            state.flag = flag;
            document.querySelectorAll('.country-btn').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');
            document.getElementById('countryCode').innerText = code;
            document.getElementById('flagDisplay').innerText = flag;
        }

        function loadSaveData() {
            if (tg.CloudStorage) {
                tg.CloudStorage.getItem('nomerok_v2_state', (err, value) => {
                    if (!err && value) {
                        try {
                            state = { ...state, ...JSON.parse(value) };
                            updateUI();
                        } catch(e){}
                    }
                });
            }
        }

        function saveData() {
            if (tg.CloudStorage) {
                tg.CloudStorage.setItem('nomerok_v2_state', JSON.stringify(state));
            }
        }

        function spinPlate() {
            if (state.balance < state.spinCost) {
                document.getElementById('logText').innerHTML = `<span style="color:var(--danger)">Не хватает денег! Нужна ${state.spinCost} ₽</span>`;
                return;
            }

            // Списываем деньги за крутку
            state.balance -= state.spinCost;

            let alpha = alphabets[state.country];
            let randChar = () => alpha[Math.floor(Math.random() * alpha.length)];
            let randNum = () => Math.floor(Math.random() * 10);

            let plateText = "";
            let numStr = "";
            let lettersStr = "";

            if (state.country === "UA") {
                let l1 = randChar() + randChar();
                let n = `${randNum()}${randNum()}${randNum()}${randNum()}`;
                let l2 = randChar() + randChar();
                plateText = `${l1} ${n} ${l2}`;
                numStr = n;
                lettersStr = l1 + l2;
            } else if (state.country === "USA") {
                let n = `${randNum()}${randNum()}${randNum()}`;
                let l = `${randChar()}${randChar()}${randChar()}`;
                plateText = `${n}-${l}`;
                numStr = n;
                lettersStr = l;
            } else {
                let l1 = randChar() + randChar();
                let n = `${randNum()}${randNum()}${randNum()}`;
                let l2 = randChar();
                plateText = `${l1}-${n}-${l2}`;
                numStr = n;
                lettersStr = l1 + l2;
            }

            document.getElementById('plateDisplay').innerText = plateText;

            // Расчет наград и блатников
            let win = 0;
            let reason = "";

            // Проверка на слова из букв (например ЧМО, ВОР, BSS, СУК, XXX)
            let rareWords = ["ЧМО", "ВОР", "СУК", "XXX", "VIP", "BOSS", "BOOP", "USA", "BAD"];
            let foundWord = rareWords.find(w => lettersStr.includes(w));

            if (numStr.includes("7777") || numStr.includes("0000")) {
                win = 250000;
                reason = `🔥 ДЖЕКПОТ! Номера 7777/0000!`;
            } else if (numStr.includes("777") || numStr.includes("000")) {
                win = 50000;
                reason = `💎 3 цифры подряд (${numStr.substr(0,3)})!`;
            } else if (foundWord) {
                win = 35000;
                reason = `😎 Блатное слово "${foundWord}"!`;
            } else if (numStr[0] === numStr[1] && numStr[1] === numStr[2]) {
                win = 15000;
                reason = `✨ 3 одинаковые цифры!`;
            } else {
                win = Math.floor(Math.random() * 300 + 100);
                reason = `Обычный номер`;
            }

            // Умножаем на коэффициент машины
            let totalWin = Math.floor(win * state.multiplier);
            state.balance += totalWin;

            if (totalWin > state.spinCost) {
                document.getElementById('logText').innerHTML = `<span style="color:var(--accent)">+${totalWin.toLocaleString()} ₽ (${reason})</span>`;
            } else {
                document.getElementById('logText').innerHTML = `<span style="color:var(--gray)">+${totalWin.toLocaleString()} ₽ (${reason})</span>`;
            }

            updateUI();
            saveData();
        }

        function buyCar(name, cost, mult) {
            if (state.balance >= cost) {
                state.balance -= cost;
                state.car = name;
                state.multiplier = mult;
                document.getElementById('carText').innerText = name;
                alert(`Поздравляем! Ты купил ${name}! Теперь выигрыш х${mult}`);
                updateUI();
                saveData();
            } else {
                alert("Не хватает денег на эту машину!");
            }
        }

        function updateUI() {
            document.getElementById('balanceText').innerText = state.balance.toLocaleString() + ' ₽';
            document.getElementById('carText').innerText = state.car;
            document.getElementById('spinCostText').innerText = state.spinCost.toLocaleString();
        }

        loadSaveData();
        updateUI();
    </script>
</body>
</html>
