<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Номерок V3</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=Roboto+Mono:wght@700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #0b0f19 !important;
            background-image: radial-gradient(circle at top, #1e1b4b 0%, #0b0f19 70%) !important;
            color: #f8fafc;
            padding: 14px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
            user-select: none;
        }

        .app-container {
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* Карточки с тиснением и блуром */
        .card {
            background: rgba(17, 24, 39, 0.8) !important;
            border: 1px solid rgba(255, 255, 255, 0.1) !important;
            border-radius: 20px !important;
            padding: 16px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .stat-val {
            font-size: 22px;
            font-weight: 900;
            margin-top: 2px;
        }

        /* Переключатель стран */
        .country-tabs {
            display: flex;
            background: #030712;
            padding: 4px;
            border-radius: 14px;
            gap: 4px;
            margin-bottom: 14px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .c-tab {
            flex: 1;
            background: transparent;
            border: none;
            color: #64748b;
            padding: 8px 0;
            font-size: 12px;
            font-weight: 800;
            border-radius: 10px;
            cursor: pointer;
        }

        .c-tab.active {
            background: #2563eb;
            color: #ffffff;
            box-shadow: 0 2px 10px rgba(37, 99, 235, 0.4);
        }

        /* Реалистичный автомобильный номер */
        .plate-box {
            background: #ffffff;
            border: 4px solid #000000;
            border-radius: 10px;
            padding: 6px 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin: 10px 0;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.6);
        }

        .plate-code {
            font-family: 'Roboto Mono', monospace;
            font-size: 26px;
            font-weight: 900;
            color: #000000;
            letter-spacing: 1px;
        }

        .plate-flag-side {
            background: #0057b7;
            height: 38px;
            width: 22px;
            border-radius: 3px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 3px 0;
            color: #ffffff;
            font-size: 9px;
            font-weight: 900;
        }

        .flag-mini {
            width: 13px;
            height: 8px;
            background: linear-gradient(to bottom, #0057b7 50%, #ffd700 50%);
            border-radius: 1px;
        }

        /* Главная кнопка */
        .spin-btn {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: #ffffff;
            border: none;
            width: 100%;
            padding: 16px;
            font-size: 17px;
            font-weight: 900;
            border-radius: 16px;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(16, 185, 129, 0.4);
            margin-top: 10px;
        }

        .spin-btn:active {
            transform: scale(0.97);
        }

        /* Сетка автосалона */
        .cars-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 10px;
        }

        .car-card {
            background: rgba(3, 7, 18, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            padding: 12px;
            text-align: center;
        }

        .car-buy-btn {
            background: #f59e0b;
            color: #000000;
            border: none;
            width: 100%;
            padding: 8px;
            font-size: 12px;
            font-weight: 900;
            border-radius: 8px;
            margin-top: 8px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- Статистика -->
        <div class="card stats-grid">
            <div>
                <div style="font-size:10px; color:#94a3b8; font-weight:800; text-transform:uppercase;">Баланс</div>
                <div class="stat-val" id="balanceText" style="color:#f59e0b;">5 000 ₽</div>
            </div>
            <div>
                <div style="font-size:10px; color:#94a3b8; font-weight:800; text-transform:uppercase;">Машина</div>
                <div class="stat-val" id="carText" style="font-size:15px; color:#38bdf8;">Пешком</div>
            </div>
        </div>

        <!-- Поле игры -->
        <div class="card" style="text-align:center;">
            <div class="country-tabs">
                <button class="c-tab active" onclick="setCountry('UA')">🇺🇦 UA</button>
                <button class="c-tab" onclick="setCountry('USA')">🇺🇸 USA</button>
                <button class="c-tab" onclick="setCountry('EU')">🇪🇺 EU</button>
                <button class="c-tab" onclick="setCountry('KZ')">🇰🇿 KZ</button>
            </div>

            <div class="plate-box">
                <div class="plate-flag-side" id="flagSide">
                    <div class="flag-mini"></div>
                    <span id="countryCode">UA</span>
                </div>
                <div class="plate-code" id="plateDisplay">KA 7777 BP</div>
            </div>

            <div id="logText" style="font-size:13px; font-weight:700; color:#94a3b8; min-height:20px; margin-top:8px;">Жми «Крутить»</div>
            <div style="font-size:11px; color:#ef4444; font-weight:800; margin-top:4px;">Списание: <span id="spinCostText">500</span> ₽</div>

            <button class="spin-btn" onclick="spinPlate()">Крутить номер</button>
        </div>

        <!-- Автосалон -->
        <div class="card">
            <div style="font-size:14px; font-weight:800;">🚗 Автосалон (Множитель)</div>
            <div class="cars-grid">
                <div class="car-card">
                    <div style="font-size:24px;">🏎️</div>
                    <div style="font-weight:800; font-size:13px; margin-top:4px;">Жигули</div>
                    <div style="font-size:10px; color:#94a3b8;">x1.5 к выигрышу</div>
                    <button class="car-buy-btn" onclick="buyCar('Жигули', 15000, 1.5)">15 000 ₽</button>
                </div>
                <div class="car-card">
                    <div style="font-size:24px;">🚘</div>
                    <div style="font-weight:800; font-size:13px; margin-top:4px;">BMW M5</div>
                    <div style="font-size:10px; color:#94a3b8;">x3.0 к выигрышу</div>
                    <button class="car-buy-btn" onclick="buyCar('BMW M5', 100000, 3.0)">100 000 ₽</button>
                </div>
                <div class="car-card">
                    <div style="font-size:24px;">🚙</div>
                    <div style="font-weight:800; font-size:13px; margin-top:4px;">Гелик</div>
                    <div style="font-size:10px; color:#94a3b8;">x5.0 к выигрышу</div>
                    <button class="car-buy-btn" onclick="buyCar('Гелик', 500000, 5.0)">500 000 ₽</button>
                </div>
                <div class="car-card">
                    <div style="font-size:24px;">🚀</div>
                    <div style="font-weight:800; font-size:13px; margin-top:4px;">Bugatti</div>
                    <div style="font-size:10px; color:#94a3b8;">x10.0 к выигрышу</div>
                    <button class="car-buy-btn" onclick="buyCar('Bugatti', 2000000, 10.0)">2 000 000 ₽</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        let state = {
            balance: 5000,
            spinCost: 500,
            car: "Пешком",
            multiplier: 1.0,
            country: "UA"
        };

        const alphabets = {
            UA: "ABCEHIKMOPTX",
            USA: "ABCDEFGHIJKLMNOPQRSTUVWXYZ",
            EU: "ABCDEFGHJKLMNPRSTUVWXYZ",
            KZ: "ABCDEFGHIJKLMNOPQRSTUVWXYZ"
        };

        function setCountry(code) {
            state.country = code;
            document.querySelectorAll('.c-tab').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');
            document.getElementById('countryCode').innerText = code;
        }

        function spinPlate() {
            if (state.balance < state.spinCost) {
                document.getElementById('logText').innerHTML = `<span style="color:#ef4444">Не хватает денег!</span>`;
                return;
            }

            state.balance -= state.spinCost;

            let alpha = alphabets[state.country];
            let randChar = () => alpha[Math.floor(Math.random() * alpha.length)];
            let randNum = () => Math.floor(Math.random() * 10);

            let plateText = "";
            let numStr = "";
            let lettersStr = "";

            if (state.country === "UA") {
                let l1 = randChar() + randChar();
                let n = `${randNum()}${randNum()}${randNum()}${randNum()}`;
                let l2 = randChar() + randChar();
                plateText = `${l1} ${n} ${l2}`;
                numStr = n;
                lettersStr = l1 + l2;
            } else {
                let l1 = randChar() + randChar();
                let n = `${randNum()}${randNum()}${randNum()}`;
                let l2 = randChar();
                plateText = `${l1}-${n}-${l2}`;
                numStr = n;
                lettersStr = l1 + l2;
            }

            document.getElementById('plateDisplay').innerText = plateText;

            let win = 0;
            let reason = "";

            let rareWords = ["ЧМО", "ВОР", "СУК", "XXX", "VIP", "BOSS", "BAD"];
            let foundWord = rareWords.find(w => lettersStr.includes(w));

            if (numStr.includes("7777") || numStr.includes("0000")) {
                win = 250000;
                reason = `🔥 ДЖЕКПОТ!`;
            } else if (numStr.includes("777") || numStr.includes("000")) {
                win = 50000;
                reason = `💎 3 цифры подряд!`;
            } else if (foundWord) {
                win = 35000;
                reason = `😎 Буквы "${foundWord}"!`;
            } else {
                win = Math.floor(Math.random() * 300 + 100);
                reason = `Обычный номер`;
            }

            let totalWin = Math.floor(win * state.multiplier);
            state.balance += totalWin;

            document.getElementById('logText').innerHTML = `<span style="color:#10b981">+${totalWin.toLocaleString()} ₽ (${reason})</span>`;
            updateUI();
        }

        function buyCar(name, cost, mult) {
            if (state.balance >= cost) {
                state.balance -= cost;
                state.car = name;
                state.multiplier = mult;
                updateUI();
            }
        }

        function updateUI() {
            document.getElementById('balanceText').innerText = state.balance.toLocaleString() + ' ₽';
            document.getElementById('carText').innerText = state.car;
            document.getElementById('spinCostText').innerText = state.spinCost.toLocaleString();
        }

        updateUI();
    </script>
</body>
</html>
